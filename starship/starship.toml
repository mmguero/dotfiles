$azure\
$nats\
$direnv\
$env_var\
$mise\
$crystal\
$custom\
$sudo\
$jobs\
$battery\
$status\
$netns\
$shell\
[\ue0b4](fg:tool_bg))\
([\ue0b6](fg:container_bg)\
$container\
$docker_context\
[\ue0b4](fg:container_bg))\
([\ue0b6](fg:status_bg)\
$cmd_duration\
$time\
$character\
[ ](bg:status_bg)\
[\ue0b4 ](fg:status_bg))\
"""

add_newline = false

[character]
format = "$symbol"
success_symbol = "[](fg:success_fg bg:status_bg)"
error_symbol = "[](fg:error_fg bg:status_bg)"

[cmd_duration]
min_time = 2000
format = "[ $duration](bold fg:duration_fg bg:status_bg)"

[time]
disabled = false
time_format = "%R"
style = "fg:status_fg bg:status_bg"
format = '[ $time ]($style)'

[os]
disabled = false
style = "bg:machine_info_bg"
format = '[$symbol]($style)'

[username]
show_always = false
style_user = "fg:machine_info_fg bg:machine_info_bg"
style_root = "bold fg:machine_info_fg bg:error_fg"
format = '[ $user ]($style)'
disabled = false

[hostname]
ssh_only = true
style = "fg:machine_info_fg bg:machine_info_bg"
format = "[$ssh_symbol$hostname ]($style)"
disabled = false

[localip]
ssh_only = true
style = "fg:machine_info_fg bg:machine_info_bg"
format = "[\uf108 $localipv4 ]($style)"
disabled = false

[git_branch]
always_show_remote = true
format = "[ $symbol($remote_name:)$branch ]($style)"
style = "fg:git_fg bg:git_bg"

[git_commit]
style = "fg:git_fg bg:git_bg"
format = '[ $hash$tag ]($style)'

[git_state]
style = "fg:git_conflicted_fg bg:git_bg"
format = '[ $state( $progress_current/$progress_total) ]($style)'

[git_metrics]
added_style = "fg:git_staged_fg bg:git_bg"
deleted_style = "fg:git_deleted_fg bg:git_bg"
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))'

[git_status]
style = "fg:git_fg bg:git_bg"
format = '([$all_status$ahead_behind ]($style))'
ahead = "[ ⇡${count}](fg:git_ahead_fg bg:git_bg)"
behind = "[ ⇣${count}](fg:git_behind_fg bg:git_bg)"
conflicted = "[ ⚑${count}](fg:git_conflicted_fg bg:git_bg)"
deleted = "[ 🗑${count}](fg:git_deleted_fg bg:git_bg)"
diverged = "[ ⇡${ahead_count}](fg:git_ahead_fg bg:git_bg)[ ⇣${behind_count}](fg:git_behind_fg bg:git_bg)"
modified = "[ ✎${count}](fg:git_modified_fg bg:git_bg)"
renamed = "[ »${count}](fg:git_renamed_fg bg:git_bg)"
staged = '[ +${count}](fg:git_staged_fg bg:git_bg)'
stashed = "[ \uea98](fg:git_stashed_fg bg:git_bg)"
untracked = "[ ≟](fg:git_untracked_fg bg:git_bg)"
up_to_date = "[ ](fg:git_uptodate_fg bg:git_bg)"

[directory]
style = "fg:directory_fg bg:directory_bg"
read_only_style = "fg:directory_fg bg:directory_bg"
format = "[ $path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "🏠 "
read_only = " 🔒"
# whole-word matches so "photos" isn't eaten by "photo", "development" by "devel", etc.
substitutions = [
  { from = '(?:\bAudio|\baudio)\b', to = "🕪", regex = true },
  { from = '(?:\bBackup|\bbackup|\bbak)\b', to = "\uf0c7", regex = true },
  { from = '(?:\bBooks|\bbooks)\b', to = " ", regex = true },
  { from = '\.config\b', to = " ", regex = true },
  { from = '\.local\b', to = " ", regex = true },
  { from = '\bDesktop\b', to = " ", regex = true },
  { from = '\bdevel\b', to = "", regex = true },
  { from = '\bDocuments\b', to = "\uf0f6", regex = true },
  { from = '(?:\bDownloads|\bdownload)\b', to = " ", regex = true },
  { from = '(?:\bGitHub|\bGithub|\bgithub)\b', to = " ", regex = true },
  { from = '(?:\bPictures|\bpictures|\bImages|\bPhotos|\bimages|\bphotos|\bPhoto|\bphoto)\b', to = " ", regex = true },
  { from = '(?:\bMalcolm|\bmalcolm)\b', to = "🤄 ", regex = true },
  { from = '(?:\bMedia|\bmedia)\b', to = " ", regex = true },
  { from = '(?:\bMusic|\bmusic)\b', to = " ", regex = true },
  { from = '\bPublic\b', to = " ", regex = true },
  { from = '\bpCloudDrive\b', to = "☁", regex = true },
  { from = '(?:\bVideos|\bvideos|\bVideo|\bvideo)\b', to = "🎞", regex = true },
  { from = '(?:\btemp|\btmp)\b', to = " ", regex = true },
]

