# https://gist.github.com/mmguero/730775739384895e84874320c1f9af66

palette = "nord"

format = """
([\ue0b6](fg:machine_info_bg)\
$username\
$hostname\
$localip\
$os\
[\ue0b4](fg:machine_info_bg))\
([\ue0b6](fg:directory_bg)\
$directory\
[\ue0b4](fg:directory_bg))\
([\ue0b6](fg:git_bg)\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
[\ue0b4](fg:git_bg))\
([\ue0b6](fg:tool_bg)\
$shlvl\
$singularity\
$kubernetes\
$vcsh\
$fossil_branch\
$fossil_metrics\
$hg_branch\
$hg_state\
$pijul_channel\
$package\
$bun\
$c\
$cmake\
